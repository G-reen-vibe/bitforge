[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitforge"
version = "0.1.0"
description = "A 1-bit machine learning framework built from scratch (Hyper-LUT Net + BNN baselines)"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.setuptools.package-data]
bitforge = ["py.typed"]
