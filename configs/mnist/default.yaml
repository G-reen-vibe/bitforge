# MNIST: each model has its own config block. Use --model to select.
# Quick smoke tests can override train.epochs=1 via CLI.

data:
  name: mnist
  root: ./data
  batch_size: 128
  test_batch_size: 256
  num_workers: 0
  augment: light

# Default model — override via CLI --model <name>
model:
  name: hyper_lut
  hv_dim: 2048
  k: 4
  num_luts: 32
  num_blocks: 4

train:
  epochs: 30
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  scheduler: cosine
  lr_min: 0.0
  grad_clip: 1.0

runtime:
  device: cpu
  num_threads: 2
  log_every: 50
  time_budget_s: 600   # 10 min cap for MNIST
  tag: ""
